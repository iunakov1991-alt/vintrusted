<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEO Dashboard - VIN Trusted</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }

    .dashboard {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      background: white;
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .header h1 {
      font-size: 32px;
      color: #667eea;
      font-weight: 700;
    }

    .build-button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 16px 32px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .build-button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }

    .build-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .build-button.running {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; }
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }

    .stat-card:hover {
      transform: translateY(-4px);
    }

    .stat-card h3 {
      font-size: 14px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .stat-card .value {
      font-size: 36px;
      font-weight: 700;
      color: #667eea;
      margin-bottom: 8px;
    }

    .stat-card .label {
      font-size: 14px;
      color: #999;
    }

    .stat-card.success .value { color: #10b981; }
    .stat-card.warning .value { color: #f59e0b; }
    .stat-card.danger .value { color: #ef4444; }

    .main-content {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    @media (max-width: 1024px) {
      .main-content {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    .panel h2 {
      font-size: 20px;
      color: #333;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .schedule-item {
      padding: 16px;
      background: #f8f9fa;
      border-radius: 12px;
      margin-bottom: 12px;
      border-left: 4px solid #667eea;
    }

    .schedule-item.urgent {
      border-left-color: #ef4444;
      background: #fef2f2;
    }

    .schedule-item.suggested {
      border-left-color: #f59e0b;
      background: #fffbeb;
    }

    .schedule-item.optimal {
      border-left-color: #10b981;
      background: #f0fdf4;
    }

    .schedule-item h4 {
      font-size: 16px;
      margin-bottom: 8px;
      color: #333;
    }

    .schedule-item p {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
    }

    .top-pages-list {
      list-style: none;
    }

    .top-pages-list li {
      padding: 12px;
      background: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .top-pages-list li .url {
      font-size: 14px;
      color: #333;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .top-pages-list li .score {
      font-size: 16px;
      font-weight: 600;
      color: #667eea;
      margin-left: 12px;
    }

    .recommendations {
      margin-top: 20px;
    }

    .recommendation {
      padding: 16px;
      background: #f8f9fa;
      border-radius: 12px;
      margin-bottom: 12px;
      border-left: 4px solid #667eea;
    }

    .recommendation.warning {
      border-left-color: #f59e0b;
      background: #fffbeb;
    }

    .recommendation.success {
      border-left-color: #10b981;
      background: #f0fdf4;
    }

    .recommendation.info {
      border-left-color: #3b82f6;
      background: #eff6ff;
    }

    .recommendation h4 {
      font-size: 16px;
      margin-bottom: 8px;
      color: #333;
    }

    .recommendation p {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
      margin-bottom: 4px;
    }

    .recommendation .action {
      font-size: 13px;
      color: #667eea;
      font-weight: 500;
      margin-top: 8px;
    }

    .machine-wishes {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 12px;
      margin-top: 12px;
    }

    .machine-wishes h4 {
      font-size: 16px;
      margin-bottom: 12px;
    }

    .machine-wishes p {
      font-size: 14px;
      line-height: 1.6;
      opacity: 0.95;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .quality-bar {
      height: 8px;
      background: #e5e7eb;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 8px;
    }

    .quality-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #10b981, #667eea);
      transition: width 0.3s;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 8px;
    }

    .status-badge.success {
      background: #d1fae5;
      color: #065f46;
    }

    .status-badge.warning {
      background: #fef3c7;
      color: #92400e;
    }

    .status-badge.danger {
      background: #fee2e2;
      color: #991b1b;
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="header">
      <div>
        <h1>🚀 SEO Dashboard</h1>
        <p style="color: #666; margin-top: 8px;">Панель управления SEO машиной</p>
      </div>
      <button class="build-button" id="buildBtn" onclick="triggerBuild()">
        ▶ Запустить билд
      </button>
    </div>

    <div class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <h3>Всего страниц</h3>
        <div class="value" id="totalPages">-</div>
        <div class="label">Сгенерировано всего</div>
      </div>

      <div class="stat-card success">
        <h3>Принято</h3>
        <div class="value" id="acceptedPages">-</div>
        <div class="label">Прошли проверку качества</div>
      </div>

      <div class="stat-card warning">
        <h3>Отклонено</h3>
        <div class="value" id="rejectedPages">-</div>
        <div class="label">Не прошли проверку</div>
      </div>

      <div class="stat-card success">
        <h3>Среднее качество</h3>
        <div class="value" id="avgQuality">-</div>
        <div class="label">Оценка качества контента</div>
        <div class="quality-bar">
          <div class="quality-bar-fill" id="qualityBar" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <div class="main-content">
      <div>
        <div class="panel">
          <h2>📅 Расписание и рекомендации</h2>
          <div id="schedule"></div>
        </div>

        <div class="panel" style="margin-top: 20px;">
          <h2>💡 Рекомендации и пожелания</h2>
          <div id="recommendations"></div>
        </div>
      </div>

      <div>
        <div class="panel">
          <h2>🏆 Топ 10 страниц</h2>
          <ul class="top-pages-list" id="topPages"></ul>
        </div>

        <div class="panel" style="margin-top: 20px;">
          <h2>⚙️ Настройки</h2>
          <div id="config"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let buildRunning = false;

    // Загрузка данных
    async function loadDashboard() {
      try {
        const response = await fetch('/api/seo-dashboard?action=stats');
        const data = await response.json();
        updateDashboard(data);
      } catch (error) {
        console.error('Error loading dashboard:', error);
        document.getElementById('statsGrid').innerHTML = 
          '<div class="loading"><div class="spinner"></div>Ошибка загрузки данных</div>';
      }
    }

    // Обновление дашборда
    function updateDashboard(data) {
      const stats = data.stats || {};
      const lastBuild = stats.lastBuild || {};

      // Основные метрики
      document.getElementById('totalPages').textContent = stats.totalPages || 0;
      document.getElementById('acceptedPages').textContent = lastBuild.pagesAccepted || 0;
      document.getElementById('rejectedPages').textContent = lastBuild.pagesRejected || 0;
      
      const avgQuality = parseFloat(lastBuild.avgQuality || 0);
      document.getElementById('avgQuality').textContent = (avgQuality * 100).toFixed(1) + '%';
      document.getElementById('qualityBar').style.width = (avgQuality * 100) + '%';

      // AI рекомендация (обновляем кнопку)
      if (data.aiRecommendation && data.aiRecommendation.shouldBuild) {
        const btn = document.getElementById('buildBtn');
        const urgency = data.aiRecommendation.urgency;
        if (urgency === 'high') {
          btn.style.background = 'linear-gradient(135deg, #f5576c 0%, #f093fb 100%)';
          btn.textContent = `🚀 ${data.aiRecommendation.targetPages} страниц (AI рекомендует)`;
        } else if (urgency === 'medium') {
          btn.style.background = 'linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%)';
          btn.textContent = `▶ ${data.aiRecommendation.targetPages} страниц (AI рекомендует)`;
        } else {
          btn.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
          btn.textContent = `▶ Запустить билд (${data.aiRecommendation.targetPages} страниц)`;
        }
      }

      // Расписание
      renderSchedule(data.schedule || {});

      // Рекомендации
      renderRecommendations(data.recommendations || {}, data.aiRecommendation);

      // Топ страниц
      renderTopPages(stats.topPages || []);

      // Настройки
      renderConfig(data.config || {});
    }

    // Рендеринг расписания
    function renderSchedule(schedule) {
      const container = document.getElementById('schedule');
      
      if (!schedule.recommendations || schedule.recommendations.length === 0) {
        container.innerHTML = '<p style="color: #666;">Загрузка расписания...</p>';
        return;
      }

      let html = '';
      
      schedule.recommendations.forEach(rec => {
        html += `
          <div class="schedule-item ${rec.type}">
            <h4>${rec.type === 'urgent' ? '🔴 Срочно' : rec.type === 'suggested' ? '🟡 Рекомендуется' : '🟢 Оптимально'}</h4>
            <p>${rec.message}</p>
            <p style="margin-top: 8px; font-weight: 600; color: #333;">Следующий запуск: ${rec.nextRun}</p>
          </div>
        `;
      });

      if (schedule.optimalTimes) {
        html += '<h3 style="margin-top: 20px; margin-bottom: 12px; font-size: 16px;">⏰ Оптимальное время для билда:</h3>';
        schedule.optimalTimes.forEach(time => {
          html += `
            <div style="padding: 12px; background: #f8f9fa; border-radius: 8px; margin-bottom: 8px;">
              <strong>${time.time}</strong> - ${time.reason}
            </div>
          `;
        });
      }

      container.innerHTML = html;
    }

    // Рендеринг рекомендаций
    function renderRecommendations(recs, aiRec = null) {
      const container = document.getElementById('recommendations');
      
      let html = '';

      // Предупреждения
      if (recs.warnings && recs.warnings.length > 0) {
        recs.warnings.forEach(w => {
          html += `
            <div class="recommendation warning">
              <h4>⚠️ ${w.title}</h4>
              <p>${w.message}</p>
              ${w.action ? `<div class="action">💡 ${w.action}</div>` : ''}
            </div>
          `;
        });
      }

      // Предложения
      if (recs.suggestions && recs.suggestions.length > 0) {
        recs.suggestions.forEach(s => {
          const typeClass = s.level === 'success' ? 'success' : s.level === 'warning' ? 'warning' : 'info';
          html += `
            <div class="recommendation ${typeClass}">
              <h4>${s.level === 'success' ? '✅' : s.level === 'warning' ? '⚠️' : 'ℹ️'} ${s.title}</h4>
              <p>${s.message}</p>
              ${s.action ? `<div class="action">💡 ${s.action}</div>` : ''}
            </div>
          `;
        });
      }

      // Пожелания от машины
      if (recs.machineWishes && recs.machineWishes.length > 0) {
        html += '<div class="machine-wishes">';
        html += '<h4>🤖 Пожелания от машины:</h4>';
        recs.machineWishes.forEach(w => {
          html += `<p>${w.message}</p>`;
        });
        html += '</div>';
      }

      if (!html) {
        html = '<p style="color: #666;">Все отлично! Нет рекомендаций.</p>';
      }

      container.innerHTML = html;
    }

    // Рендеринг топ страниц
    function renderTopPages(pages) {
      const container = document.getElementById('topPages');
      
      if (!pages || pages.length === 0) {
        container.innerHTML = '<li style="color: #666;">Нет данных о страницах</li>';
        return;
      }

      let html = '';
      pages.forEach((page, idx) => {
        const score = (page.qualityScore || 0) * 100;
        html += `
          <li>
            <span style="color: #999; margin-right: 8px;">#${idx + 1}</span>
            <span class="url">${page.url || 'N/A'}</span>
            <span class="score">${score.toFixed(1)}%</span>
          </li>
        `;
      });

      container.innerHTML = html;
    }

    // Рендеринг настроек
    function renderConfig(config) {
      const container = document.getElementById('config');
      
      let html = `
        <div style="padding: 12px; background: #f8f9fa; border-radius: 8px; margin-bottom: 8px;">
          <strong>Целевое количество:</strong> ${config.targetPages || 10000} страниц
        </div>
        <div style="padding: 12px; background: #f8f9fa; border-radius: 8px; margin-bottom: 8px;">
          <strong>Минимальное качество:</strong> ${((config.minQuality || 0.70) * 100).toFixed(0)}%
        </div>
        <div style="padding: 12px; background: #f8f9fa; border-radius: 8px;">
          <strong>Semantic Score вес:</strong> ${((config.semanticWeight || 0.20) * 100).toFixed(0)}%
        </div>
      `;

      container.innerHTML = html;
    }

    // Запуск билда
    async function triggerBuild() {
      if (buildRunning) {
        alert('Билд уже запущен! Пожалуйста, подождите.');
        return;
      }

      const btn = document.getElementById('buildBtn');
      btn.disabled = true;
      btn.classList.add('running');
      btn.textContent = '⏳ Билд запускается...';
      buildRunning = true;

      try {
        const response = await fetch('/api/seo-dashboard?action=build', {
          method: 'POST'
        });
        const data = await response.json();

        if (data.success) {
          alert('✅ ' + data.message);
          // Обновляем данные через 5 секунд
          setTimeout(() => {
            loadDashboard();
            buildRunning = false;
            btn.disabled = false;
            btn.classList.remove('running');
            btn.textContent = '▶ Запустить билд';
          }, 5000);
        } else {
          alert('❌ Ошибка: ' + (data.error || data.message));
          buildRunning = false;
          btn.disabled = false;
          btn.classList.remove('running');
          btn.textContent = '▶ Запустить билд';
        }
      } catch (error) {
        alert('❌ Ошибка при запуске билда: ' + error.message);
        buildRunning = false;
        btn.disabled = false;
        btn.classList.remove('running');
        btn.textContent = '▶ Запустить билд';
      }
    }

    // Автообновление каждые 30 секунд
    loadDashboard();
    setInterval(loadDashboard, 30000);
  </script>
</body>
</html>
