<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Cancelled - VIN Trust</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon.png?v=20251211">
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg?v=20251211">
    <link rel="icon" type="image/png" href="/img/favicon.png?v=20251211">
    <link rel="apple-touch-icon" href="/img/favicon.png?v=20251211">
    <link rel="shortcut icon" type="image/png" href="/img/favicon.png?v=20251211">
    <link rel="stylesheet" href="styles.css">
    <style>
        .cancel-container {
            max-width: 600px;
            margin: 100px auto;
            padding: 40px;
            text-align: center;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .cancel-icon {
            font-size: 4rem;
            color: #dc3545;
            margin-bottom: 20px;
        }
        
        .cancel-title {
            font-size: 2rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 15px;
        }
        
        .cancel-message {
            font-size: 1.1rem;
            color: #6b7280;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .cancel-info {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            color: #856404;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
        }
        
        .btn-primary {
            background: #007bff;
            color: white;
        }
        
        .btn-primary:hover {
            background: #0056b3;
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #545b62;
        }
    </style>
</head>
<body>
    <div class="cancel-container">
        <div class="cancel-icon">✗</div>
        <h1 class="cancel-title">Payment Cancelled</h1>
        <p class="cancel-message">
            Your payment was cancelled. No charges have been made to your account.
        </p>
        
        <div class="cancel-info">
            <strong>What happened?</strong><br>
            You may have cancelled the payment, encountered an error, or the payment was declined by your bank.
        </div>
        
        <div class="action-buttons">
            <a href="/report.html" class="btn btn-primary">Try Again</a>
            <a href="/index.html" class="btn btn-secondary">Back to Home</a>
        </div>
    </div>
</body>
</html>
