<!DOCTYPE html>
<html>
<head>
  <title>Тест кнопок</title>
</head>
<body>
  <h1>Тест кнопок дашборда</h1>
  <button id="btn-start">▶ Запустить</button>
  <button id="btn-stop">⏹ Остановить</button>
  <button id="btn-start-batch">🚀 Запустить партию</button>
  <script>
    document.getElementById('btn-start').addEventListener('click', () => {
      alert('Кнопка Запустить работает!');
    });
    document.getElementById('btn-stop').addEventListener('click', () => {
      alert('Кнопка Остановить работает!');
    });
    document.getElementById('btn-start-batch').addEventListener('click', () => {
      alert('Кнопка Запустить партию работает!');
    });
  </script>
</body>
</html>
