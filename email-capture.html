<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>Enter Your Email - VIN Trust</title>

    })(window,document,'script','dataLayer','GTM-KR67NRNW');</script>

      window.dataLayer = window.dataLayer || [];

      gtag('js', new Date());

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f8fa;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .logo {
            width: 140px;
            margin-bottom: 30px;
        }
        
        .vin-found-chip {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: #27ae60;
            color: white;
            font-size: 28px;
            font-weight: 700;
            padding: 16px 40px;
            border-radius: 50px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(39, 174, 96, 0.4);
        }
        
        .vin-found-chip .checkmark {
            font-size: 32px;
        }
        
        .vin-display {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
            padding: 16px 30px;
            border-radius: 15px;
            margin: 20px 0 30px;
            letter-spacing: 2px;
            background: white;
            border: 2px solid #e0e0e0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        
        .subtitle {
            color: #4b5563;
            font-size: 18px;
            margin-bottom: 30px;
            font-weight: 500;
        }
        
        .email-form-wrapper {
            width: 100%;
            max-width: 500px;
        }
        
        .email-input-wrapper {
            position: relative;
        }
        
        .email-input {
            width: 100%;
            height: 80px;
            padding: 0 20px;
            padding-right: 70px;
            font-size: 20px;
            border: 4px solid #000;
            border-radius: 15px;
            background: white;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .email-input:focus {
            outline: none;
            box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.2);
        }
        
        .email-input.valid {
            background: #27ae60;
            color: white;
            border-color: #27ae60;
        }
        
        .email-input.valid::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        
        .email-suggestions {
            display: flex;
            flex-direction: row;
            gap: 6px;
            align-items: center;
            margin-top: 10px;
            margin-bottom: 15px;
        }
        
        .email-chip {
            background: rgba(102, 126, 234, 0.15);
            color: #667eea;
            border: 1px solid rgba(102, 126, 234, 0.3);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            font-weight: 600;
        }
        
        .email-chip:hover {
            background: rgba(102, 126, 234, 0.25);
            transform: scale(1.05);
        }
        
        .email-chip:active {
            transform: scale(0.95);
        }
        
        .submit-btn {
            width: 100%;
            height: 80px;
            background: #FDB913;
            color: #000;
            font-size: 20px;
            font-weight: 700;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 20px rgba(253, 185, 19, 0.4);
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(253, 185, 19, 0.6);
        }
        
        .submit-btn:active {
            transform: translateY(0);
        }
        
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .checkmark-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 28px;
            color: white;
            display: none;
        }
        
        .email-input.valid ~ .checkmark-icon {
            display: block;
        }
        
        @media (max-width: 768px) {
            .logo {
                width: 120px;
                margin-bottom: 20px;
            }
            
            .vin-found-chip {
                font-size: 22px;
                padding: 12px 30px;
            }
            
            .vin-found-chip .checkmark {
                font-size: 26px;
            }
            
            .vin-display {
                font-size: 18px;
                padding: 12px 20px;
                margin: 15px 0 20px;
            }
            
            .subtitle {
                font-size: 16px;
                margin-bottom: 25px;
            }
            
            .email-input {
                height: 80px;
                font-size: 18px;
                padding-right: 60px;
            }
            
            .submit-btn {
                height: 80px;
                font-size: 18px;
            }
            
            .email-chip {
                font-size: 11px;
                padding: 4px 10px;
            }
            
            .checkmark-icon {
                right: 20px;
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KR67NRNW"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    
    <img src="/logo-vin-trust.png" alt="VIN Trust" class="logo">
    
    <div class="vin-found-chip">
        <span class="checkmark">✓</span>
        <span>VIN FOUND</span>
    </div>
    
    <div class="vin-display" id="vinDisplay">Loading...</div>
    
    <p class="subtitle">Enter your email to receive your vehicle history report</p>
    
    <div class="email-form-wrapper">
        <form id="emailForm">
            <div class="email-input-wrapper">
                <input 
                    type="text" 
                    class="email-input" 
                    id="emailInput" 
                    placeholder="your@email.com" 
                    required
                    autocomplete="off"
                >
                <div class="checkmark-icon">✓</div>
            </div>
            <div class="email-suggestions" id="emailSuggestions"></div>
            <button type="submit" class="submit-btn" id="submitBtn">
                Get My Report
            </button>
        </form>
    </div>
    
    <script>
        // Popular email domains
        const popularDomains = [
            '@gmail.com',
            '@icloud.com',
            '@outlook.com',
            '@yahoo.com'
        ];
        
        // Get VIN from URL
        const urlParams = new URLSearchParams(window.location.search);
        const vin = urlParams.get('vin');
        
        // Display VIN
        if (vin) {
            document.getElementById('vinDisplay').textContent = vin;
        } else {
            // Redirect to home if no VIN
            window.location.href = '/';
        }
        
        // Handle form submission
        const form = document.getElementById('emailForm');
        const emailInput = document.getElementById('emailInput');
        const submitBtn = document.getElementById('submitBtn');
        const suggestionsContainer = document.getElementById('emailSuggestions');
        
        // Render email domain suggestions
        function renderSuggestions() {
            suggestionsContainer.innerHTML = popularDomains
                .map(domain => `<div class="email-chip" data-domain="${domain}">${domain}</div>`)
                .join('');
            
            // Add click handlers to chips
            document.querySelectorAll('.email-chip').forEach(chip => {
                chip.addEventListener('click', function(e) {
                    e.preventDefault();
                    const domain = this.getAttribute('data-domain');
                    const currentValue = emailInput.value.trim();
                    
                    // Extract username part (before @)
                    let username = currentValue;
                    if (currentValue.includes('@')) {
                        username = currentValue.split('@')[0];
                    }
                    
                    // Set new email value
                    if (username) {
                        emailInput.value = username + domain;
                        validateEmail();
                    }
                });
            });
        }
        
        // Validate email
        function validateEmail() {
            const email = emailInput.value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            
            if (emailRegex.test(email)) {
                emailInput.classList.add('valid');
            } else {
                emailInput.classList.remove('valid');
            }
        }
        
        // Initialize suggestions
        renderSuggestions();
        
        // Real-time validation
        emailInput.addEventListener('input', validateEmail);
        
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            
            // Validate email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                emailInput.focus();
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';
            
            console.log('[EMAIL CAPTURE] 📧 Email collected:', email, 'VIN:', vin);
            
            const transactionId = vin + '_' + Date.now();
            
            // 🎯 Отправляем событие email_collected для тега "ИМЕЙЛ тег"
            window.dataLayer.push({
                'event': 'email_collected',
                'vin': vin,
                'email': email,
                'timestamp': new Date().toISOString(),
                'transaction_id': transactionId
            });
            console.log('[EMAIL CAPTURE] ✅ Pushed email_collected event');
            
            // 🎯 Отправляем событие conversion для остальных тегов GTM
            window.dataLayer.push({
                'event': 'conversion',
                'vin': vin,
                'email': email,
                'transaction_id': transactionId
            });
            console.log('[EMAIL CAPTURE] ✅ Pushed conversion event');
            
            // Redirect to report page with VIN and email - увеличиваю задержку до 1500ms
            setTimeout(() => {
                console.log('[EMAIL CAPTURE] 🔄 Redirecting to report page...');
                window.location.href = `/report.html?vin=${encodeURIComponent(vin)}&email=${encodeURIComponent(email)}`;
            }, 1500);
        });
    </script>
</body>
</html>
