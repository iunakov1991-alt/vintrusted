<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>Enter Your Email - VIN Trust</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f8fa;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .logo {
            width: 140px;
            margin-bottom: 30px;
        }
        
        .vin-found-chip {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: #27ae60;
            color: white;
            font-size: 28px;
            font-weight: 700;
            padding: 16px 40px;
            border-radius: 50px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(39, 174, 96, 0.4);
        }
        
        .vin-found-chip .checkmark {
            font-size: 32px;
        }
        
        .vin-display {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
            padding: 16px 30px;
            border-radius: 15px;
            margin: 20px 0 30px;
            letter-spacing: 2px;
            background: white;
            border: 2px solid #e0e0e0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        
        .subtitle {
            color: #4b5563;
            font-size: 18px;
            margin-bottom: 30px;
            font-weight: 500;
        }
        
        .email-form-wrapper {
            width: 100%;
            max-width: 500px;
        }
        
        .email-input-wrapper {
            position: relative;
        }
        
        .email-input {
            width: 100%;
            height: 80px;
            padding: 0 20px;
            padding-right: 70px;
            font-size: 20px;
            border: 4px solid #000;
            border-radius: 15px;
            background: white;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .email-input:focus {
            outline: none;
            box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.2);
        }
        
        .email-input.valid {
            background: #27ae60;
            color: white;
            border-color: #27ae60;
        }
        
        .email-input.valid::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        
        .email-suggestions {
            display: flex;
            flex-direction: row;
            gap: 6px;
            align-items: center;
            margin-top: 10px;
            margin-bottom: 15px;
        }
        
        .email-chip {
            background: rgba(102, 126, 234, 0.15);
            color: #667eea;
            border: 1px solid rgba(102, 126, 234, 0.3);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            font-weight: 600;
        }
        
        .email-chip:hover {
            background: rgba(102, 126, 234, 0.25);
            transform: scale(1.05);
        }
        
        .email-chip:active {
            transform: scale(0.95);
        }
        
        .submit-btn {
            width: 100%;
            height: 80px;
            background: #FDB913;
            color: #000;
            font-size: 20px;
            font-weight: 700;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 20px rgba(253, 185, 19, 0.4);
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(253, 185, 19, 0.6);
        }
        
        .submit-btn:active {
            transform: translateY(0);
        }
        
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .checkmark-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 28px;
            color: white;
            display: none;
        }
        
        .email-input.valid ~ .checkmark-icon {
            display: block;
        }
        
        /* ── Loading Screen ── */
        .loading-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .loading-screen.visible {
            display: flex;
        }

        .loading-title {
            font-size: 22px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .loading-subtitle {
            font-size: 15px;
            color: #6b7280;
            margin-bottom: 32px;
            min-height: 22px;
            transition: opacity 0.4s ease;
        }

        .progress-track {
            width: 100%;
            height: 10px;
            background: #e5e7eb;
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 14px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #27ae60, #2ecc71);
            border-radius: 99px;
            transition: width 0.3s ease;
        }

        .progress-pct {
            font-size: 14px;
            font-weight: 700;
            color: #27ae60;
        }

        .loading-checks {
            margin-top: 28px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .loading-check {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #9ca3af;
            font-weight: 500;
            transition: color 0.4s ease;
        }

        .loading-check.done {
            color: #1a1a1a;
        }

        .check-icon {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid #d1d5db;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
            transition: all 0.4s ease;
        }

        .loading-check.done .check-icon {
            background: #27ae60;
            border-color: #27ae60;
            color: white;
        }

        @media (max-width: 768px) {
            .logo {
                width: 120px;
                margin-bottom: 20px;
            }
            
            .vin-found-chip {
                font-size: 22px;
                padding: 12px 30px;
            }
            
            .vin-found-chip .checkmark {
                font-size: 26px;
            }
            
            .vin-display {
                font-size: 18px;
                padding: 12px 20px;
                margin: 15px 0 20px;
            }
            
            .subtitle {
                font-size: 16px;
                margin-bottom: 25px;
            }
            
            .email-input {
                height: 80px;
                font-size: 18px;
                padding-right: 60px;
            }
            
            .submit-btn {
                height: 80px;
                font-size: 18px;
            }
            
            .email-chip {
                font-size: 11px;
                padding: 4px 10px;
            }
            
            .checkmark-icon {
                right: 20px;
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KR67NRNW"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    
    <img src="/logo-vin-trust.png" alt="VIN Trust" class="logo">
    
    <div class="vin-found-chip">
        <span class="checkmark">✓</span>
        <span>VIN FOUND</span>
    </div>
    
    <div class="vin-display" id="vinDisplay">Loading...</div>
    
    <p class="subtitle">Enter your email to receive your vehicle history report</p>
    
    <div class="email-form-wrapper" id="emailFormWrapper">
        <form id="emailForm">
            <div class="email-input-wrapper">
                <input 
                    type="text" 
                    class="email-input" 
                    id="emailInput" 
                    placeholder="your@email.com" 
                    required
                    autocomplete="off"
                >
                <div class="checkmark-icon">✓</div>
            </div>
            <div class="email-suggestions" id="emailSuggestions"></div>
            <button type="submit" class="submit-btn" id="submitBtn">
                Get My Report
            </button>
        </form>
    </div>

    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-title">Preparing Your Report...</div>
        <div class="loading-subtitle" id="loadingStatus">Searching vehicle databases...</div>
        <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-pct" id="progressPct">0%</div>
        <div class="loading-checks">
            <div class="loading-check" id="check1">
                <div class="check-icon" id="checkIcon1"></div>
                <span>VIN verification</span>
            </div>
            <div class="loading-check" id="check2">
                <div class="check-icon" id="checkIcon2"></div>
                <span>Accident &amp; damage records</span>
            </div>
            <div class="loading-check" id="check3">
                <div class="check-icon" id="checkIcon3"></div>
                <span>Ownership &amp; title history</span>
            </div>
            <div class="loading-check" id="check4">
                <div class="check-icon" id="checkIcon4"></div>
                <span>Odometer &amp; recall data</span>
            </div>
        </div>
    </div>
    
    <script>
        // Popular email domains
        const popularDomains = [
            '@gmail.com',
            '@icloud.com',
            '@outlook.com',
            '@yahoo.com'
        ];
        
        // Get VIN from URL
        const urlParams = new URLSearchParams(window.location.search);
        const vin = urlParams.get('vin');
        
        // Display VIN
        if (vin) {
            document.getElementById('vinDisplay').textContent = vin;
        } else {
            // Redirect to home if no VIN
            window.location.href = '/';
        }
        
        // Handle form submission
        const form = document.getElementById('emailForm');
        const emailInput = document.getElementById('emailInput');
        const submitBtn = document.getElementById('submitBtn');
        const suggestionsContainer = document.getElementById('emailSuggestions');
        
        // Render email domain suggestions
        function renderSuggestions() {
            suggestionsContainer.innerHTML = popularDomains
                .map(domain => `<div class="email-chip" data-domain="${domain}">${domain}</div>`)
                .join('');
            
            // Add click handlers to chips
            document.querySelectorAll('.email-chip').forEach(chip => {
                chip.addEventListener('click', function(e) {
                    e.preventDefault();
                    const domain = this.getAttribute('data-domain');
                    const currentValue = emailInput.value.trim();
                    
                    // Extract username part (before @)
                    let username = currentValue;
                    if (currentValue.includes('@')) {
                        username = currentValue.split('@')[0];
                    }
                    
                    // Set new email value
                    if (username) {
                        emailInput.value = username + domain;
                        validateEmail();
                    }
                });
            });
        }
        
        // Validate email
        function validateEmail() {
            const email = emailInput.value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            
            if (emailRegex.test(email)) {
                emailInput.classList.add('valid');
            } else {
                emailInput.classList.remove('valid');
            }
        }
        
        // Initialize suggestions
        renderSuggestions();
        
        // Real-time validation
        emailInput.addEventListener('input', validateEmail);
        
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            
            // Validate email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                emailInput.focus();
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Checking...';
            
            // Show loading screen after brief delay
            setTimeout(() => showLoadingScreen(vin, email), 300);
            
            console.log('[EMAIL CAPTURE] 📧 Email collected:', email, 'VIN:', vin);
            
            const transactionId = vin + '_' + Date.now();
            
            // 🎯 Отправляем событие email_collected для тега "ИМЕЙЛ тег"
            window.dataLayer.push({
                'event': 'email_collected',
                'vin': vin,
                'email': email,
                'timestamp': new Date().toISOString(),
                'transaction_id': transactionId
            });
            console.log('[EMAIL CAPTURE] ✅ Pushed email_collected event');
            
            // 🎯 Отправляем событие conversion для остальных тегов GTM
            window.dataLayer.push({
                'event': 'conversion',
                'vin': vin,
                'email': email,
                'transaction_id': transactionId
            });
            console.log('[EMAIL CAPTURE] ✅ Pushed conversion event');
            
            // ===== NEW: REPEAT BUYER DETECTION =====
            try {
                console.log('[EMAIL CAPTURE] 🔍 Checking if customer exists...');
                
                const checkResponse = await fetch('/api/check-customer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, vin })
                });
                
                const customerData = await checkResponse.json();
                
                if (customerData.exists) {
                    console.log('[EMAIL CAPTURE] ✅ Existing customer detected!');
                    console.log('[EMAIL CAPTURE] Customer has:', customerData.reports_count, 'reports');
                    console.log('[EMAIL CAPTURE] Quota remaining:', customerData.quota_remaining);
                    
                    // Redirect to personal cabinet
                    setTimeout(() => {
                        console.log('[EMAIL CAPTURE] 🔄 Redirecting to personal cabinet...');
                        window.location.href = `/my-reports.html?email=${encodeURIComponent(email)}`;
                    }, 800);
                    return;
                }
                
                console.log('[EMAIL CAPTURE] ℹ️  New customer - proceeding to payment');
            } catch (checkError) {
                console.error('[EMAIL CAPTURE] ⚠️  Customer check failed, proceeding to payment:', checkError.message);
            }
            
            // Redirect happens inside showLoadingScreen after 15s
        });

        function showLoadingScreen(vin, email) {
            // Swap form → loading screen
            document.getElementById('emailFormWrapper').style.display = 'none';
            document.querySelector('.subtitle').style.display = 'none';
            const screen = document.getElementById('loadingScreen');
            screen.classList.add('visible');

            const DURATION = 15000; // 15 seconds
            const steps = [
                { at: 0,     pct: 0,   status: 'Searching vehicle databases...',   check: null },
                { at: 1500,  pct: 18,  status: 'VIN verified successfully',         check: 1 },
                { at: 4000,  pct: 38,  status: 'Checking accident records...',      check: null },
                { at: 6500,  pct: 55,  status: 'Accident & damage data retrieved',  check: 2 },
                { at: 9000,  pct: 70,  status: 'Verifying ownership history...',    check: null },
                { at: 11000, pct: 82,  status: 'Title history confirmed',           check: 3 },
                { at: 13000, pct: 93,  status: 'Compiling odometer & recall data...', check: null },
                { at: 14200, pct: 100, status: 'Report ready!',                     check: 4 },
            ];

            const fill    = document.getElementById('progressFill');
            const pctEl   = document.getElementById('progressPct');
            const statusEl = document.getElementById('loadingStatus');

            steps.forEach(({ at, pct, status, check }) => {
                setTimeout(() => {
                    fill.style.width = pct + '%';
                    pctEl.textContent = pct + '%';
                    statusEl.textContent = status;
                    if (check) {
                        const row  = document.getElementById('check' + check);
                        const icon = document.getElementById('checkIcon' + check);
                        row.classList.add('done');
                        icon.textContent = '✓';
                    }
                }, at);
            });

            // Redirect after 15 seconds
            setTimeout(() => {
                console.log('[EMAIL CAPTURE] 🔄 Redirecting to report page...');
                window.location.href = `/report.html?vin=${encodeURIComponent(vin)}&email=${encodeURIComponent(email)}`;
            }, DURATION);
        }
    </script>
</body>
</html>
