<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile VIN</title>
</head>
<body style="margin:0; padding:50px; background:#667eea; color:white; font-family:Arial; font-size:30px;">

<h1 style="text-align:center; font-size:60px; margin-bottom:40px;">CHECK VIN</h1>

<div style="text-align:center;">
    <button style="width:100%; max-width:400px; height:100px; font-size:35px; background:#fbbf24; border:none; border-radius:20px; margin-bottom:20px;">VIN</button>
    
    <input type="text" placeholder="Enter VIN" style="width:100%; max-width:400px; height:100px; font-size:35px; padding:20px; border-radius:20px; border:none; margin-bottom:20px; display:block; margin-left:auto; margin-right:auto;">
    
    <button style="width:100%; max-width:400px; height:100px; font-size:35px; background:#fbbf24; border:none; border-radius:20px; font-weight:bold;">GET REPORT</button>
</div>

<p style="text-align:center; margin-top:40px;">Screen: <span id="info"></span></p>

<script>
document.getElementById('info').textContent = window.innerWidth + 'x' + window.innerHeight;
</script>

</body>
</html>
