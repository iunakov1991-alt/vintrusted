<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc0000;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Red circle background -->
  <circle cx="16" cy="16" r="15" fill="url(#redGradient)" stroke="#000000" stroke-width="1"/>
  
  <!-- White arrow -->
  <path d="M10 8 L22 16 L10 24 Z" fill="white" stroke="#000000" stroke-width="0.5" filter="url(#shadow)"/>
  
  <!-- Arrow tail -->
  <rect x="8" y="14" width="8" height="4" fill="white" stroke="#000000" stroke-width="0.5" filter="url(#shadow)"/>
</svg>
