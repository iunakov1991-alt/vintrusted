name: Autonomy Daily SEO Cycle

on:
  schedule:
    - cron: "0 7 * * *"   # каждый день в 07:00 UTC
  workflow_dispatch:

jobs:
  autonomy-daily:
    name: autonomy-daily
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      NODE_ENV: production
      CI: "true"

      # Лёгкий CI-режим SEO
      SEO_MAX_PAGES_PER_BUILD: "10000"
      SEO_TARGET_PAGES: "10000"
      SEO_URLS_PER_SITEMAP: "20000"
      SEO_TARGET_FULL_EXPOSURE_DAYS: "120"
      SEO_MIN_SITEMAPS_PER_DAY: "1"
      SEO_MAX_SITEMAPS_PER_DAY: "20"

      AUTONOMY_HARD_TIMEOUT_MIN: "40"
      AUTONOMY_MODE: "ci-light"

      # Отключаем тяжёлый RL/AI в CI
      AI_RL_ENABLED: "false"
      AI_MAX_TOKENS: "400"
      AI_MAX_SECTIONS: "3"

      # Остальные переменные берутся из GitHub Secrets/Variables
      # (STRIPE_*, CLEARVIN_*, SEO_BASE_URL, DEEPSEEK_API_KEY, GROQ_API_KEY и т.д.)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Run autonomy daily cycle (CI light)
        run: npm run autonomy:daily:ci

      - name: Build dashboard only
        run: npm run dashboard:build

      - name: Trigger Vercel redeploy
        if: success()
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            echo "Triggering Vercel redeploy..."
            curl -X POST "$VERCEL_DEPLOY_HOOK"
          else
            echo "VERCEL_DEPLOY_HOOK not set, skipping redeploy trigger."
          fi
