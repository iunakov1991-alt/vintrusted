name: Autonomy Daily SEO Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  autonomy-daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run placeholder step
        run: |
          echo "Autonomy daily job started"
          echo "Add your SEO scripts here"

      - name: Trigger Vercel redeploy
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "No VERCEL_TOKEN provided, skipping redeploy"
            exit 0
          fi
          curl -X POST "https://api.vercel.com/v1/integrations/deploy/prj_xxx" \
            -H "Authorization: Bearer $VERCEL_TOKEN"
