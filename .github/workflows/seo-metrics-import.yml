name: SEO Metrics Import (Weekly)

on:
  schedule:
    # Каждый понедельник в 2:00 UTC (можно настроить)
    - cron: '0 2 * * 1'
  workflow_dispatch: # Позволяет запускать вручную

jobs:
  import-metrics:
    runs-on: ubuntu-latest
    name: Import GSC and GA Metrics
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Import GSC data (if file provided)
        run: |
          if [ -f "data/seo/gsc-export.csv" ]; then
            echo "📊 Importing GSC data from CSV..."
            node scripts/seo/utils/gsc-import.js --csv data/seo/gsc-export.csv
          elif [ -f "data/seo/gsc-export.json" ]; then
            echo "📊 Importing GSC data from JSON..."
            node scripts/seo/utils/gsc-import.js --json data/seo/gsc-export.json
          else
            echo "ℹ️  No GSC export file found. To enable GSC import:"
            echo "   1. Export data from Google Search Console (CSV or JSON)"
            echo "   2. Place file as data/seo/gsc-export.csv or data/seo/gsc-export.json"
            echo "   3. Commit and push the file"
          fi
        continue-on-error: true
      
      - name: Import GA data (if file provided)
        run: |
          if [ -f "data/seo/ga-export.csv" ]; then
            echo "📊 Importing GA data from CSV..."
            node scripts/seo/utils/metrics-import.js --csv data/seo/ga-export.csv
          elif [ -f "data/seo/ga-export.json" ]; then
            echo "📊 Importing GA data from JSON..."
            node scripts/seo/utils/metrics-import.js --json data/seo/ga-export.json
          else
            echo "ℹ️  No GA export file found. To enable GA import:"
            echo "   1. Export data from Google Analytics 4 (CSV or JSON)"
            echo "   2. Place file as data/seo/ga-export.csv or data/seo/ga-export.json"
            echo "   3. Commit and push the file"
          fi
        continue-on-error: true
      
      - name: Commit and push if data changed
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/seo/gsc-cache.json data/seo/gsc-data.json data/seo/external-metrics.json || true
          git diff --staged --quiet || (git commit -m "Auto: Update SEO metrics from GSC/GA import [skip ci]" && git push) || true
      
      - name: Summary
        if: always()
        run: |
          echo "## 📊 SEO Metrics Import Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Weekly metrics import completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** To enable automatic import:" >> $GITHUB_STEP_SUMMARY
          echo "1. Export data from GSC/GA" >> $GITHUB_STEP_SUMMARY
          echo "2. Place files in data/seo/ directory" >> $GITHUB_STEP_SUMMARY
          echo "3. Commit and push" >> $GITHUB_STEP_SUMMARY

