<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fa" />
      <stop offset="100%" stop-color="#e9ecef" />
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066b3" />
      <stop offset="100%" stop-color="#004d8c" />
    </linearGradient>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eb001b" />
      <stop offset="100%" stop-color="#c40016" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bgGradient)" />
  
  <!-- Header Section -->
  <rect x="0" y="0" width="1200" height="80" fill="url(#blueGradient)" opacity="0.9" />
  <rect x="40" y="20" width="40" height="40" fill="#ffffff" opacity="0.9" />
  <rect x="100" y="25" width="200" height="10" fill="#ffffff" opacity="0.8" />
  <rect x="100" y="45" width="150" height="8" fill="#ffffff" opacity="0.6" />
  
  <!-- Main Content Box -->
  <rect x="60" y="120" width="1080" height="350" fill="#ffffff" stroke="#dee2e6" stroke-width="2" rx="8" />
  
  <!-- Vehicle Icon -->
  <rect x="100" y="160" width="120" height="80" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1" rx="4" />
  <rect x="110" y="170" width="100" height="20" fill="#495057" opacity="0.7" />
  <rect x="110" y="200" width="40" height="10" fill="#6c757d" opacity="0.6" />
  <rect x="170" y="200" width="40" height="10" fill="#6c757d" opacity="0.6" />
  
  <!-- Data Sections -->
  <rect x="280" y="160" width="300" height="20" fill="#e9ecef" />
  <rect x="280" y="190" width="250" height="12" fill="#f8f9fa" />
  <rect x="280" y="210" width="300" height="20" fill="#e9ecef" />
  <rect x="280" y="240" width="220" height="12" fill="#f8f9fa" />
  <rect x="280" y="260" width="300" height="20" fill="#e9ecef" />
  <rect x="280" y="290" width="180" height="12" fill="#f8f9fa" />
  
  <!-- Status Indicators -->
  <circle cx="650" cy="180" r="8" fill="#28a745" opacity="0.8" />
  <circle cx="650" cy="230" r="8" fill="#ffc107" opacity="0.8" />
  <circle cx="650" cy="280" r="8" fill="#dc3545" opacity="0.8" />
  
  <!-- Texas State Outline -->
  <path d="M950 200 L1000 180 L1050 200 L1040 250 L990 270 L940 250 Z" fill="url(#redGradient)" opacity="0.8" />
  <rect x="970" y="220" width="20" height="15" fill="#ffffff" opacity="0.9" />
  <rect x="985" y="210" width="10" height="25" fill="#ffffff" opacity="0.9" />
  
  <!-- Footer Elements -->
  <rect x="60" y="500" width="1080" height="4" fill="#dee2e6" />
  <rect x="100" y="520" width="80" height="6" fill="#6c757d" opacity="0.5" />
  <rect x="220" y="520" width="80" height="6" fill="#6c757d" opacity="0.5" />
  <rect x="340" y="520" width="80" height="6" fill="#6c757d" opacity="0.5" />
  
  <!-- Geometric Pattern -->
  <circle cx="1100" cy="100" r="15" fill="#0066b3" opacity="0.1" />
  <circle cx="1150" cy="150" r="12" fill="#eb001b" opacity="0.1" />
  <circle cx="1120" cy="550" r="18" fill="#0066b3" opacity="0.1" />
  <rect x="50" y="80" width="20" height="20" fill="#eb001b" opacity="0.1" transform="rotate(45 50 80)" />
</svg>