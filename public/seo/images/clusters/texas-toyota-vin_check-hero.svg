<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fa" />
      <stop offset="100%" stop-color="#e9ecef" />
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066cc" />
      <stop offset="100%" stop-color="#004d99" />
    </linearGradient>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cc3333" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="800" fill="url(#bgGradient)" />
  
  <!-- Header Section -->
  <rect x="0" y="0" width="1200" height="80" fill="#2c3e50" />
  <rect x="40" y="20" width="160" height="40" fill="#ecf0f1" rx="4" />
  <rect x="220" y="20" width="120" height="40" fill="#3498db" rx="4" />
  
  <!-- Main Content Area -->
  <rect x="60" y="120" width="1080" height="560" fill="white" rx="8" stroke="#bdc3c7" stroke-width="1" />
  
  <!-- Vehicle Outline -->
  <g transform="translate(600, 400)">
    <!-- Car Body -->
    <rect x="-180" y="-60" width="360" height="120" rx="40" fill="#34495e" />
    <rect x="-160" y="-80" width="320" height="40" rx="20" fill="#2c3e50" />
    
    <!-- Windows -->
    <rect x="-140" y="-70" width="120" height="30" rx="8" fill="#3498db" opacity="0.6" />
    <rect x="20" y="-70" width="120" height="30" rx="8" fill="#3498db" opacity="0.6" />
    
    <!-- Wheels -->
    <circle cx="-120" cy="40" r="25" fill="url(#blueGradient)" />
    <circle cx="120" cy="40" r="25" fill="url(#blueGradient)" />
    <circle cx="-120" cy="40" r="15" fill="#2c3e50" />
    <circle cx="120" cy="40" r="15" fill="#2c3e50" />
  </g>
  
  <!-- Data Visualization Elements -->
  <rect x="120" y="200" width="300" height="12" fill="#ecf0f1" rx="6" />
  <rect x="120" y="200" width="240" height="12" fill="url(#blueGradient)" rx="6" />
  
  <rect x="120" y="240" width="300" height="12" fill="#ecf0f1" rx="6" />
  <rect x="120" y="240" width="270" height="12" fill="url(#blueGradient)" rx="6" />
  
  <rect x="120" y="280" width="300" height="12" fill="#ecf0f1" rx="6" />
  <rect x="120" y="280" width="180" height="12" fill="url(#blueGradient)" rx="6" />
  
  <!-- Status Indicators -->
  <circle cx="780" cy="220" r="16" fill="#27ae60" />
  <circle cx="780" cy="260" r="16" fill="#27ae60" />
  <circle cx="780" cy="300" r="16" fill="url(#redGradient)" />
  
  <!-- Document Lines -->
  <line x1="120" y1="350" x2="480" y2="350" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="120" y1="380" x2="480" y2="380" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="120" y1="410" x2="480" y2="410" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="4,4" />
  
  <!-- Texas-inspired Accent -->
  <path d="M 1000 600 L 1100 550 L 1100 650 Z" fill="#bf0d3e" opacity="0.8" />
  <rect x="1000" y="575" width="100" height="50" fill="#002868" opacity="0.8" />
  
  <!-- Footer Section -->
  <rect x="0" y="720" width="1200" height="80" fill="#2c3e50" />
  <rect x="500" y="740" width="200" height="8" fill="#ecf0f1" rx="4" />
  <rect x="520" y="760" width="160" height="8" fill="#7f8c8d" rx="4" />
</svg>