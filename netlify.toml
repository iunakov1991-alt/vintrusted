[build]
  command = "echo 'No build needed'"
  publish = "."

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/report.html"
  to = "/report.html"
  status = 200

[[redirects]]
  from = "/payment-success"
  to = "/payment-success.html"
  status = 200

[[redirects]]
  from = "/payment-cancel"
  to = "/payment-cancel.html"
  status = 200

[[redirects]]
  from = "/loading.html"
  to = "/loading.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
