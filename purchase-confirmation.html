<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase Confirmed - VIN TRUST</title>
    
    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-KR67NRNW');</script>
    <!-- End Google Tag Manager -->
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .confirmation-container {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .checkmark-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #10b981;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: scaleIn 0.5s ease-out 0.3s both;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
            }
            to {
                transform: scale(1);
            }
        }

        .checkmark {
            width: 40px;
            height: 40px;
            border: 4px solid white;
            border-top: none;
            border-right: none;
            transform: rotate(-45deg);
            animation: checkmark 0.4s ease-out 0.6s both;
        }

        @keyframes checkmark {
            from {
                width: 0;
                height: 0;
            }
            to {
                width: 40px;
                height: 40px;
            }
        }

        h1 {
            font-size: 32px;
            color: #1f2937;
            margin-bottom: 16px;
            font-weight: 700;
        }

        .thank-you {
            font-size: 20px;
            color: #6b7280;
            margin-bottom: 40px;
        }

        .report-status {
            background: #f3f4f6;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .report-status h2 {
            font-size: 18px;
            color: #374151;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            animation: progressAnimation 10s linear forwards;
            transform-origin: left;
        }

        @keyframes progressAnimation {
            from {
                transform: scaleX(0);
            }
            to {
                transform: scaleX(1);
            }
        }

        .progress-text {
            font-size: 14px;
            color: #6b7280;
            animation: fadeInOut 2s infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e5e7eb;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .countdown {
            font-size: 14px;
            color: #9ca3af;
            margin-top: 10px;
        }

        .vin-display {
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
            letter-spacing: 1px;
        }

        @media (max-width: 640px) {
            .confirmation-container {
                padding: 40px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .thank-you {
                font-size: 16px;
            }

            .vin-display {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KR67NRNW"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    
    <div class="confirmation-container">
        <div class="checkmark-circle">
            <div class="checkmark"></div>
        </div>
        
        <h1>Payment Successful!</h1>
        <p class="thank-you">Thank you for your purchase. Your VIN report is being prepared.</p>
        
        <div class="report-status">
            <h2><span class="spinner"></span>Generating Your Report</h2>
            
            <div class="progress-container">
                <div class="progress-bar"></div>
            </div>
            
            <p class="progress-text">Processing vehicle history data...</p>
            <p class="countdown">Redirecting in <span id="countdown">10</span> seconds</p>
            
            <div class="vin-display" id="vinDisplay">Loading VIN...</div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════
        // CLIENT-SIDE FALLBACK: Fire Google Ads conversion if server fails
        // Серверный webhook (stripe-conversion-webhook.js) - основной метод
        // Этот код - резервный вариант на случай сбоя webhook
        // ═══════════════════════════════════════════════════════════════
        
        // Get cookie value by name (for A/B test variant AND gclid)
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }
        
        // Get A/B test variant
        const abVariant = getCookie('ab_variant') || 'unknown';
        console.log('[CONFIRMATION] 🎯 A/B Test Variant:', abVariant);
        
        // Get gclid from cookie (saved by gclid-cookie.js)
        const gclid = getCookie('gclid') || '';
        if (gclid) {
            console.log('[CONFIRMATION] 🔗 GCLID found:', gclid.substring(0, 10) + '...');
        } else {
            console.log('[CONFIRMATION] ⚠️  No GCLID - conversion won\'t attribute to Ads click');
        }
        
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const vin = urlParams.get('vin') || '';
        const setupIntentId = urlParams.get('setup_intent') || '';
        
        console.log('[CONFIRMATION] 🔄 Page loaded with:', { vin, setupIntentId, abVariant, hasGclid: !!gclid });
        
        // Display VIN
        const vinDisplayElement = document.getElementById('vinDisplay');
        if (vinDisplayElement) {
            vinDisplayElement.textContent = vin ? vin.toUpperCase() : 'VIN: N/A';
        }

        // ┌─────────────────────────────────────────────────────────────┐
        // │ ФУНКЦИЯ: ОТПРАВИТЬ ВСЕ КОНВЕРСИИ (GTM + FALLBACK)           │
        // └─────────────────────────────────────────────────────────────┘
        function fireConversionEvents(verifyData = null) {
            // Push events to dataLayer (GTM will handle them)
            window.dataLayer = window.dataLayer || [];
            
            // ════════════════════════════════════════════════════════════
            // ОСНОВНОЙ МЕТОД: Серверный webhook отправит конверсию
            // Stripe webhook → Google Ads напрямую
            // ════════════════════════════════════════════════════════════
            console.log('[CONFIRMATION] ℹ️  Primary conversion tracking: Server-side webhook');
            console.log('[CONFIRMATION] ℹ️  Fallback: Client-side gtag event (below)');
            
            // ════════════════════════════════════════════════════════════
            // РЕЗЕРВНЫЙ МЕТОД: Client-side Google Ads conversion
            // На случай если webhook временно недоступен
            // ════════════════════════════════════════════════════════════
            if (window.gtag) {
                window.gtag('event', 'conversion', {
                    'send_to': 'AW-17824079146/l62hCKPTndgbEKq6I7NC',
                    'value': 3.0,
                    'currency': 'USD',
                    'transaction_id': setupIntentId || ''
                });
                console.log('[CONFIRMATION] ✅ FALLBACK: Client-side Google Ads conversion fired');
            } else {
                console.log('[CONFIRMATION] ⚠️  gtag not available - fallback skipped');
            }
            
            // Google Analytics Purchase Event
            window.dataLayer.push({
                'event': 'purchase',
                'transaction_id': setupIntentId || '',
                'value': 3.0,
                'currency': 'USD',
                'vin': vin || '',
                'ab_variant': abVariant,
                'items': [{
                    'item_id': 'vin_report',
                    'item_name': 'VIN Report',
                    'price': 3.0,
                    'quantity': 1
                }]
            });
            console.log('[CONFIRMATION] ✅ GA4 purchase event pushed to dataLayer (variant:', abVariant + ')');

            // Custom POKUPKA event for Google Analytics
            window.dataLayer.push({
                'event': 'POKUPKA',
                'transaction_id': setupIntentId || '',
                'value': 3.0,
                'currency': 'USD',
                'vin': vin || '',
                'ab_variant': abVariant,
                'event_category': 'ecommerce',
                'event_label': 'VIN Report Purchase'
            });
            console.log('[CONFIRMATION] ✅ GA4 POKUPKA event pushed to dataLayer (variant:', abVariant + ')');

            console.log('[CONFIRMATION] 🎉 All conversion events fired successfully!');
            console.log('[CONFIRMATION] 📊 Payment details:', {
                vin: vin,
                setup_intent: setupIntentId,
                value: 3.0,
                events: ['conversion (server+fallback)', 'purchase', 'POKUPKA'],
                verified: verifyData ? true : false,
                stripe_status: verifyData?.setup_intent?.status,
                payment_method: verifyData?.setup_intent?.payment_method
            });
            
            // ┌─────────────────────────────────────────────────────────────┐
            // │ LOG CONVERSION TO INTERNAL TRACKING SYSTEM                   │
            // └─────────────────────────────────────────────────────────────┘
            logConversion();
        }
        
        // ┌─────────────────────────────────────────────────────────────┐
        // │ ФУНКЦИЯ: ЛОГИРОВАНИЕ КОНВЕРСИИ В ВНУТРЕННЮЮ СИСТЕМУ          │
        // └─────────────────────────────────────────────────────────────┘
        async function logConversion() {
            if (!vin || !setupIntentId) {
                console.log('[CONVERSION] ⚠️  Skipping conversion logging - missing VIN or setup_intent');
                return;
            }
            
            try {
                // Get UTM parameters from URL or sessionStorage
                const utmSource = urlParams.get('utm_source') || sessionStorage.getItem('utm_source') || 'direct';
                const utmMedium = urlParams.get('utm_medium') || sessionStorage.getItem('utm_medium') || 'none';
                const utmCampaign = urlParams.get('utm_campaign') || sessionStorage.getItem('utm_campaign') || 'none';
                
                const conversionData = {
                    vin: vin,
                    abVariant: abVariant,
                    device: /Mobile|Android|iPhone/i.test(navigator.userAgent) ? 'mobile' : 'desktop',
                    source: utmSource,
                    medium: utmMedium,
                    campaign: utmCampaign,
                    sessionId: setupIntentId
                };
                
                console.log('[CONVERSION] 📤 Logging conversion:', conversionData);
                
                const response = await fetch('/api/log-conversion', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(conversionData)
                });
                
                if (response.ok) {
                    const result = await response.json();
                    console.log('[CONVERSION] ✅ Conversion logged successfully:', result.conversionId);
                } else {
                    const error = await response.json();
                    console.error('[CONVERSION] ❌ Failed to log conversion:', error);
                }
            } catch (error) {
                console.error('[CONVERSION] ❌ Error logging conversion:', error);
                // Don't block the page if logging fails
            }
        }

        // ┌─────────────────────────────────────────────────────────────┐
        // │ ШАГ 1: ПРОВЕРИТЬ ЧТО ОПЛАТА РЕАЛЬНО ПРОШЛА                  │
        // │ Дергаем /api/verify-payment для валидации в Stripe          │
        // │ ⚠️  ТЕСТОВЫЙ РЕЖИМ: si_test* → пропускаем проверку           │
        // └─────────────────────────────────────────────────────────────┘
        async function verifyAndTrackPayment() {
            if (!setupIntentId) {
                console.error('[CONFIRMATION] ❌ No setup_intent in URL - cannot verify payment');
                document.querySelector('.progress-text').textContent = 'Error: Missing payment information';
                return;
            }

            // 🧪 ТЕСТОВЫЙ РЕЖИМ: пропускаем проверку оплаты
            const isTestMode = setupIntentId.startsWith('si_test');
            
            if (isTestMode) {
                console.log('[CONFIRMATION] 🧪 TEST MODE: Skipping payment verification');
                console.log('[CONFIRMATION] 🧪 Firing conversion events WITHOUT Stripe check...');
                fireConversionEvents();
                return;
            }

            try {
                console.log('[CONFIRMATION] 🔄 Verifying payment with Stripe...');
                
                const verifyResponse = await fetch(`/api/verify-payment?setup_intent=${setupIntentId}`);
                const verifyData = await verifyResponse.json();
                
                console.log('[CONFIRMATION] 📥 Verification result:', verifyData);

                // ┌─────────────────────────────────────────────────────────┐
                // │ ШАГ 2: ЕСЛИ ОПЛАТА НЕ ПРОШЛА - НЕ ОТСТУКИВАЕМ GA4      │
                // └─────────────────────────────────────────────────────────┘
                if (!verifyData.paid) {
                    console.error('[CONFIRMATION] ❌ Payment NOT confirmed in Stripe!');
                    console.error('[CONFIRMATION] ❌ Reason:', verifyData.reason || verifyData.error);
                    console.error('[CONFIRMATION] ❌ NOT firing GA4 events (no real payment)');
                    
                    // Показать ошибку пользователю
                    document.querySelector('h1').textContent = 'Payment Processing...';
                    document.querySelector('.thank-you').textContent = 
                        'Your payment is being processed. This may take a few moments.';
                    document.querySelector('.progress-text').textContent = 
                        'Waiting for payment confirmation...';
                    
                    // Попробовать еще раз через 3 секунды
                    setTimeout(() => {
                        console.log('[CONFIRMATION] 🔄 Retrying payment verification...');
                        verifyAndTrackPayment();
                    }, 3000);
                    
                    return;
                }

                // ┌─────────────────────────────────────────────────────────┐
                // │ ШАГ 3: ОПЛАТА ПОДТВЕРЖДЕНА → ОТСТУКИВАЕМ GA4            │
                // └─────────────────────────────────────────────────────────┘
                console.log('[CONFIRMATION] ✅ Payment CONFIRMED in Stripe!');
                console.log('[CONFIRMATION] ✅ Firing conversion events...');
                fireConversionEvents(verifyData);

            } catch (error) {
                console.error('[CONFIRMATION] ❌ Error verifying payment:', error);
                console.error('[CONFIRMATION] ❌ NOT firing GA4 events due to error');
                
                // Показать ошибку
                document.querySelector('.progress-text').textContent = 
                    'Error verifying payment. Please contact support.';
            }
        }

        // Запустить проверку оплаты
        verifyAndTrackPayment();

        // Countdown timer
        let seconds = 10;
        const countdownElement = document.getElementById('countdown');
        
        if (countdownElement) {
            const countdownInterval = setInterval(() => {
                seconds--;
                countdownElement.textContent = seconds;
                
                if (seconds <= 0) {
                    clearInterval(countdownInterval);
                }
            }, 1000);
        }

        // Redirect to report page after 10 seconds
        setTimeout(() => {
            const successUrl = `/success.html?vin=${encodeURIComponent(vin)}&setup_intent=${encodeURIComponent(setupIntentId)}`;
            window.location.href = successUrl;
        }, 10000);
    </script>
</body>
</html>
