<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase Confirmed - VIN TRUST</title>
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7NHGR30SMV"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-7NHGR30SMV');
    </script>

    <!-- Google Ads Conversion Tag -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-17824079146"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-17824079146');
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .confirmation-container {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .checkmark-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #10b981;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: scaleIn 0.5s ease-out 0.3s both;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
            }
            to {
                transform: scale(1);
            }
        }

        .checkmark {
            width: 40px;
            height: 40px;
            border: 4px solid white;
            border-top: none;
            border-right: none;
            transform: rotate(-45deg);
            animation: checkmark 0.4s ease-out 0.6s both;
        }

        @keyframes checkmark {
            from {
                width: 0;
                height: 0;
            }
            to {
                width: 40px;
                height: 40px;
            }
        }

        h1 {
            font-size: 32px;
            color: #1f2937;
            margin-bottom: 16px;
            font-weight: 700;
        }

        .thank-you {
            font-size: 20px;
            color: #6b7280;
            margin-bottom: 40px;
        }

        .report-status {
            background: #f3f4f6;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .report-status h2 {
            font-size: 18px;
            color: #374151;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            animation: progressAnimation 10s linear forwards;
            transform-origin: left;
        }

        @keyframes progressAnimation {
            from {
                transform: scaleX(0);
            }
            to {
                transform: scaleX(1);
            }
        }

        .progress-text {
            font-size: 14px;
            color: #6b7280;
            animation: fadeInOut 2s infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e5e7eb;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .countdown {
            font-size: 14px;
            color: #9ca3af;
            margin-top: 10px;
        }

        .vin-display {
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
            letter-spacing: 1px;
        }

        @media (max-width: 640px) {
            .confirmation-container {
                padding: 40px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .thank-you {
                font-size: 16px;
            }

            .vin-display {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="confirmation-container">
        <div class="checkmark-circle">
            <div class="checkmark"></div>
        </div>
        
        <h1>Payment Successful!</h1>
        <p class="thank-you">Thank you for your purchase. Your VIN report is being prepared.</p>
        
        <div class="report-status">
            <h2><span class="spinner"></span>Generating Your Report</h2>
            
            <div class="progress-container">
                <div class="progress-bar"></div>
            </div>
            
            <p class="progress-text">Processing vehicle history data...</p>
            <p class="countdown">Redirecting in <span id="countdown">10</span> seconds</p>
            
            <div class="vin-display" id="vinDisplay">Loading VIN...</div>
        </div>
    </div>

    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const vin = urlParams.get('vin') || '';
        const setupIntentId = urlParams.get('setup_intent') || '';
        
        // Display VIN
        const vinDisplayElement = document.getElementById('vinDisplay');
        if (vinDisplayElement) {
            vinDisplayElement.textContent = vin ? vin.toUpperCase() : 'VIN: N/A';
        }

        // Fire Google Ads Conversion Event
        gtag('event', 'conversion', {
            'send_to': 'AW-17824079146/1pFQCO7iz9UbEKq6l7NC',
            'value': 3.0,
            'currency': 'USD',
            'transaction_id': setupIntentId || ''
        });

        // Fire Google Analytics Purchase Event
        gtag('event', 'purchase', {
            'transaction_id': setupIntentId || '',
            'value': 3.0,
            'currency': 'USD',
            'items': [{
                'item_id': 'vin_report',
                'item_name': 'VIN Report',
                'price': 3.0,
                'quantity': 1
            }]
        });

        // Fire custom POKUPKA event for Google Analytics goal
        gtag('event', 'POKUPKA', {
            'transaction_id': setupIntentId || '',
            'value': 3.0,
            'currency': 'USD',
            'vin': vin || '',
            'event_category': 'ecommerce',
            'event_label': 'VIN Report Purchase'
        });

        console.log('✅ Conversion tracked:', {
            vin: vin,
            setup_intent: setupIntentId,
            value: 3.0,
            events: ['purchase', 'POKUPKA']
        });

        // Countdown timer
        let seconds = 10;
        const countdownElement = document.getElementById('countdown');
        
        if (countdownElement) {
            const countdownInterval = setInterval(() => {
                seconds--;
                countdownElement.textContent = seconds;
                
                if (seconds <= 0) {
                    clearInterval(countdownInterval);
                }
            }, 1000);
        }

        // Redirect to report page after 10 seconds
        setTimeout(() => {
            const successUrl = `/success.html?vin=${encodeURIComponent(vin)}&setup_intent=${encodeURIComponent(setupIntentId)}`;
            window.location.href = successUrl;
        }, 10000);
    </script>
</body>
</html>
