<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>VIN TRUST - Car VIN Check</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        .mobile-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* 1. ЛОГО */
        .logo {
            width: 150px;
            height: auto;
            margin-bottom: 30px;
        }
        
        /* 2. ЗАГОЛОВОК */
        .title {
            font-size: 80px;
            font-weight: 700;
            color: #ffffff;
            text-align: center;
            margin-bottom: 60px;
            line-height: 1.2;
        }
        
        /* 3. ФОРМА */
        .form-container {
            width: 100%;
            max-width: 100%;
        }
        
        /* 4. КНОПКИ VIN/PLATE */
        .mode-buttons {
            display: flex;
            gap: 30px;
            margin-bottom: 20px;
            justify-content: center;
        }
        
        .mode-btn {
            flex: 1;
            max-width: 450px;
            height: 125px;
            border-radius: 30px;
            font-size: 40px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.2);
            border: 5px solid rgba(255, 255, 255, 0.4);
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s;
            -webkit-tap-highlight-color: transparent;
        }
        
        .mode-btn.active {
            background: #fbbf24;
            border-color: #fbbf24;
            color: #1a1a1a;
        }
        
        /* 5. ПОЛЯ ВВОДА */
        .input-container {
            width: 100%;
            margin-bottom: 40px;
        }
        
        .input-mode {
            display: none;
            flex-direction: column;
            gap: 30px;
        }
        
        .input-mode.active {
            display: flex;
        }
        
        input[type="text"],
        select {
            width: 100%;
            height: 130px;
            border-radius: 30px;
            padding: 0 40px;
            font-size: 40px;
            background: rgba(255, 255, 255, 0.95);
            border: 5px solid rgba(255, 255, 255, 0.3);
            color: #1a1a1a;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
        
        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #fbbf24;
        }
        
        /* 6. КНОПКА GET REPORT */
        .submit-btn {
            width: 100%;
            height: 140px;
            border-radius: 35px;
            font-size: 45px;
            font-weight: 700;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: #1a1a1a;
            border: none;
            cursor: pointer;
            margin-bottom: 80px;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 10px 30px rgba(251, 191, 36, 0.3);
        }
        
        .submit-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <!-- 1. ЛОГО -->
        <img src="/logo-vin-trust.png" alt="VIN TRUST" class="logo">
        
        <!-- 2. ЗАГОЛОВОК -->
        <h1 class="title">CHECK VIN</h1>
        
        <!-- 3. ФОРМА -->
        <div class="form-container">
            <!-- 4. КНОПКИ VIN/PLATE -->
            <div class="mode-buttons">
                <button class="mode-btn active" id="vinBtn" onclick="switchMode('vin')">VIN</button>
                <button class="mode-btn" id="plateBtn" onclick="switchMode('plate')">License Plate</button>
            </div>
            
            <!-- 5. ПОЛЯ ВВОДА -->
            <div class="input-container">
                <!-- VIN MODE -->
                <div class="input-mode active" id="vinMode">
                    <input type="text" id="vinInput" placeholder="Enter VIN" maxlength="17">
                </div>
                
                <!-- PLATE MODE -->
                <div class="input-mode" id="plateMode">
                    <input type="text" id="plateInput" placeholder="License Plate">
                    <select id="stateSelect">
                        <option value="">Choose Your State</option>
                        <option value="AL">Alabama</option>
                        <option value="AK">Alaska</option>
                        <option value="AZ">Arizona</option>
                        <option value="AR">Arkansas</option>
                        <option value="CA">California</option>
                        <option value="CO">Colorado</option>
                        <option value="CT">Connecticut</option>
                        <option value="DE">Delaware</option>
                        <option value="FL">Florida</option>
                        <option value="GA">Georgia</option>
                        <option value="HI">Hawaii</option>
                        <option value="ID">Idaho</option>
                        <option value="IL">Illinois</option>
                        <option value="IN">Indiana</option>
                        <option value="IA">Iowa</option>
                        <option value="KS">Kansas</option>
                        <option value="KY">Kentucky</option>
                        <option value="LA">Louisiana</option>
                        <option value="ME">Maine</option>
                        <option value="MD">Maryland</option>
                        <option value="MA">Massachusetts</option>
                        <option value="MI">Michigan</option>
                        <option value="MN">Minnesota</option>
                        <option value="MS">Mississippi</option>
                        <option value="MO">Missouri</option>
                        <option value="MT">Montana</option>
                        <option value="NE">Nebraska</option>
                        <option value="NV">Nevada</option>
                        <option value="NH">New Hampshire</option>
                        <option value="NJ">New Jersey</option>
                        <option value="NM">New Mexico</option>
                        <option value="NY">New York</option>
                        <option value="NC">North Carolina</option>
                        <option value="ND">North Dakota</option>
                        <option value="OH">Ohio</option>
                        <option value="OK">Oklahoma</option>
                        <option value="OR">Oregon</option>
                        <option value="PA">Pennsylvania</option>
                        <option value="RI">Rhode Island</option>
                        <option value="SC">South Carolina</option>
                        <option value="SD">South Dakota</option>
                        <option value="TN">Tennessee</option>
                        <option value="TX">Texas</option>
                        <option value="UT">Utah</option>
                        <option value="VT">Vermont</option>
                        <option value="VA">Virginia</option>
                        <option value="WA">Washington</option>
                        <option value="WV">West Virginia</option>
                        <option value="WI">Wisconsin</option>
                        <option value="WY">Wyoming</option>
                    </select>
                </div>
            </div>
            
            <!-- 6. КНОПКА GET REPORT -->
            <button class="submit-btn" onclick="submitForm()">GET REPORT</button>
        </div>
    </div>
    
    <script>
        // Переключение режимов
        function switchMode(mode) {
            if (mode === 'vin') {
                document.getElementById('vinBtn').classList.add('active');
                document.getElementById('plateBtn').classList.remove('active');
                document.getElementById('vinMode').classList.add('active');
                document.getElementById('plateMode').classList.remove('active');
            } else {
                document.getElementById('plateBtn').classList.add('active');
                document.getElementById('vinBtn').classList.remove('active');
                document.getElementById('plateMode').classList.add('active');
                document.getElementById('vinMode').classList.remove('active');
            }
        }
        
        // VIN auto-uppercase
        document.getElementById('vinInput').addEventListener('input', function(e) {
            this.value = this.value.toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g, '');
        });
        
        // Plate auto-uppercase
        document.getElementById('plateInput').addEventListener('input', function(e) {
            this.value = this.value.toUpperCase();
        });
        
        // Submit
        function submitForm() {
            const vinMode = document.getElementById('vinMode').classList.contains('active');
            
            if (vinMode) {
                const vin = document.getElementById('vinInput').value;
                if (vin.length === 17) {
                    window.location.href = '/report.html?vin=' + vin;
                } else {
                    alert('Please enter a valid 17-character VIN');
                }
            } else {
                const plate = document.getElementById('plateInput').value;
                const state = document.getElementById('stateSelect').value;
                if (plate && state) {
                    window.location.href = '/report.html?plate=' + plate + '&state=' + state;
                } else {
                    alert('Please enter license plate and select state');
                }
            }
        }
    </script>
</body>
</html>
