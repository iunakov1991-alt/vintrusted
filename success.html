<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - VIN Trust</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .success-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .success-content {
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .success-icon {
            font-size: 80px;
            color: #FFD700;
            margin-bottom: 20px;
        }
        .success-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #111827;
        }
        .success-message {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .loader {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #FFD700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-content">
            <div class="success-icon">✓</div>
            <h1 class="success-title">Payment Successful!</h1>
            <p class="success-message">
                Your payment has been processed successfully.<br>
                Generating your vehicle history report...
            </p>
            <div class="loader"></div>
        </div>
    </div>

    <script>
        // Auto-redirect to report page
        (function() {
            const params = new URLSearchParams(window.location.search);
            const cs = params.get('cs');
            
            if (cs) {
                // Redirect to report page after 2 seconds
                setTimeout(() => {
                    window.location.href = `/report-view.html?id=${cs}`;
                }, 2000);
            } else {
                // No checkout session ID, redirect to home
                setTimeout(() => {
                    window.location.href = '/';
                }, 3000);
            }
        })();
    </script>
</body>
</html>
